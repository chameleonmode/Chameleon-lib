<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromeleon</title>
  <style>
    :root {
      /* Light theme variables (default) */
      --bg-color: #f3f2f1;
      --container-bg: #ffffff;
      --text-color: #323130;
      --text-muted: #666666;
      --primary-color: #0078d4;
      --primary-hover: #005a9e;
      --toggle-bg: #c8c6c4;
      --border-color: #c8c6c4;
      --border-light: #f0f0f0;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --slider-bg: #c8c6c4;
      --thumb-bg: #0078d4;
      --button-hover: #ececec;
      --input-bg: #ffffff;
      --danger-color: #d83b01;
      --disabled-color: #a6a6a6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark theme variables */
        --bg-color: #1e1e1e;
        --container-bg: #2d2d2d;
        --text-color: #e0e0e0;
        --text-muted: #a0a0a0;
        --primary-color: #0091ff;
        --primary-hover: #47aeff;
        --toggle-bg: #505050;
        --border-color: #505050;
        --border-light: #3a3a3a;
        --shadow-color: rgba(0, 0, 0, 0.3);
        --slider-bg: #505050;
        --thumb-bg: #0091ff;
        --button-hover: #3a3a3a;
        --input-bg: #3a3a3a;
        --danger-color: #ff6347;
        --disabled-color: #707070;
      }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 4px;
      color: var(--text-color);
    }

    .container {
      width: 300px;
      margin: 0 auto;
      padding: 12px;
      background-color: var(--container-bg);
      border-radius: 4px;
      box-shadow: 0 4px 8px var(--shadow-color);
    }

    .title {
      font-size: 1.5em;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--primary-color);
    }

    .subtitle {
      font-size: 1.25em;
      font-weight: 500;
      margin: 8px 0px 8px 0px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .setting-item {
      margin-bottom: 15px;
      padding-left: 0px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-weight: 400;
      color: var(--text-color);
    }

    .checkmark {
      margin-right: 4px;
      width: 20px;
      height: 20px;
      accent-color: var(--primary-color);
    }

    .toggle {
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .toggle.inline {
      margin-left: auto;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .toggle-switch {
      width: 30px;
      height: 16px;
      background-color: var(--toggle-bg);
      border-radius: 10px;
      position: relative;
      transition: background-color 0.3s;
    }

    .toggle-switch::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background-color: var(--container-bg);
      border-radius: 50%;
      transition: transform 0.3s;
    }

    input[type="checkbox"]:checked+.toggle-switch {
      background-color: var(--primary-color);
    }

    input[type="checkbox"]:checked+.toggle-switch::before {
      transform: translateX(14px);
    }

    .toggle-label {
      margin-left: 4px;
      color: var(--text-color);
      font-weight: 400;
    }

    .dropdown {
      margin-top: 10px;
    }

    .searchable-select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      transition: border-color 0.3s;
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    .searchable-select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .dropdown-label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .setting-subitem {
      margin-top: 10px;
      padding-left: 12px;
    }

    .disabled .toggle-switch {
      background-color: var(--disabled-color);
    }

    .disabled .toggle-label {
      color: var(--disabled-color);
    }

    .highlight {
      font-weight: 600;
      color: var(--primary-color);
    }

    input[type="text"] {
      width: calc(100% - 20px);
      padding: 10px;
      margin-top: 5px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      transition: border-color 0.3s;
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      transition: border-color 0.3s;
    }

    select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    label {
      font-weight: 500;
    }

    #status-text {
      margin-left: 4px;
      font-weight: 600;
    }

    .stats {
      margin-top: 20px;
    }

    .refresh-button {
      margin-left: 10px;
      padding: 4px;
      background: transparent;
      border: none;
      border-radius: 180px;
      cursor: pointer;
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
    }

    .refresh-button:hover {
      background-color: var(--button-hover);
    }

    .refresh-icon {
      width: 18px;
      height: 18px;
      filter: var(--icon-filter);
    }

    .dropdown-inline {
      display: flex;
      align-items: center;
    }

    .dropdown-inline select {
      flex-grow: 1;
      margin-right: 10px;
    }

    /* Styling for all slider containers */
    .slider-container {
      margin-top: 10px;
      margin-bottom: 5px;
    }

    /* Common styling for all range inputs */
    input[type="range"] {
      width: 100%;
      background: var(--slider-bg);
      height: 8px;
      border-radius: 4px;
      outline: none;
      transition: background 0.3s;
      margin: 6px 0;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--thumb-bg);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--thumb-bg);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s;
      border: none;
    }

    input[type="range"]::-ms-thumb {
      width: 20px;
      height: 20px;
      background: var(--thumb-bg);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s;
      border: none;
    }

    input[type="range"]:hover::-webkit-slider-thumb,
    input[type="range"]:hover::-moz-range-thumb,
    input[type="range"]:hover::-ms-thumb {
      background: var(--primary-hover);
    }

    /* Styling for slider value displays */
    .slider-value {
      display: block;
      margin-top: 4px;
      font-size: 0.9em;
      color: var(--text-muted);
      text-align: right;
    }

    /* Noise level slider styling */
    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 0.8em;
      color: var(--text-muted);
    }

    #noise-level-text {
      font-weight: 600;
      color: var(--primary-color);
    }

    /* Added for tabs */
    .tab-container {
      margin-top: 15px;
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-button {
      flex: 1;
      padding: 8px 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 500;
      color: var(--text-muted);
      position: relative;
      text-align: center;
    }

    .tab-button.active {
      color: var(--primary-color);
    }

    .tab-button.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--primary-color);
    }

    .tab-content {
      display: none;
      padding-top: 10px;
    }

    .tab-content.active {
      display: block;
    }

    /* Specific styles for bypass list */
    .bypass-list {
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-top: 10px;
      padding: 5px;
      background-color: var(--input-bg);
    }

    .bypass-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
      border-bottom: 1px solid var(--border-light);
    }

    .bypass-item:last-child {
      border-bottom: none;
    }

    .bypass-delete {
      color: var(--danger-color);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 5px;
    }

    .add-bypass {
      display: flex;
      margin-top: 10px;
    }

    .add-bypass input {
      flex-grow: 1;
      margin-right: 5px;
      margin-top: 0;
    }

    .add-bypass button {
      background-color: var(--primary-color);
      color: var(--container-bg);
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .add-bypass button:hover {
      background-color: var(--primary-hover);
    }

    #save-button {
  width: 24px;
  height: 24px;
  background-color: transparent;
  border: none;
  position: relative;
  cursor: pointer;
  outline: none;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.3s;
}

#save-button:hover {
  background-color: var(--button-hover);
}

/* Floppy disk base */
#save-button::before {
  content: "";
  position: absolute;
  width: 13.5px;
  height: 15px;
  background-color: var(--text-color);
  border-radius: 2px;
}

/* The notch in the floppy disk */
#save-button::after {
  content: "";
  position: absolute;
  top: 2px;
  right: 6px;
  width: 3px;
  height: 3px;
  background-color: var(--container-bg);
  border-radius: 1px;
}

/* The inner rectangle of the floppy disk */
#save-button:before {
  content: "";
  position: absolute;
  width: 13.5px;
  height: 15px;
  background-color: var(--text-color);
  border-radius: 2px;
}

/* The 'rectangle' inside */
#save-button:after {
  content: "";
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 7.5px;
  height: 4.5px;
  background-color: var(--container-bg);
}

/* Active/clicked effect */
#save-button:active {
  background-color: var(--primary-color);
  opacity: 0.7;
}

/* Dark mode adjustments happen automatically through CSS variables */

    /* Dark mode SVG filter for icons */
    @media (prefers-color-scheme: dark) {
      .refresh-icon {
        filter: invert(1);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="title">Chromeleon</h1>
    <div class="toggle-container">
      <label class="toggle">
        <input type="checkbox" id="toggle-extension" hidden checked>
        <span class="toggle-switch"></span>
        <span class="toggle-label" id="status-text">Enabled</span>
      </label>
    </div>

    <div class="tab-container">
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="settings">Settings</button>
        <button class="tab-button" data-tab="bypass">Bypass</button>
        <button class="tab-button" data-tab="advanced">Advanced</button>
      </div>

      <!-- Settings Tab -->
      <div id="settings-tab" class="tab-content active">
        <h2 class="subtitle">
          Protection Settings
          <button id="save-button" type="button" title="Save"></button>
        </h2>

        <!-- Noise Level Slider -->
        <div class="setting-item">
          <label class="dropdown-label">Noise Level: <span id="noise-level-text">Medium</span></label>
          <div class="slider-container">
            <input type="range" id="noise-level-slider" min="1" max="9" value="4" step="1">
            <div class="slider-labels">
              <span>Nano</span>
              <span>...</span>
              <span>Max</span>
            </div>
          </div>
        </div>

        <!-- Canvas Protection -->
        <div class="setting-item">
          <label for="canvas-protection" class="checkbox">
            <input class="checkmark" type="checkbox" id="canvas-protection" checked>
            Canvas
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="random-canvas-spoofing" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
        </div>

        <!-- Client Rects -->
        <div class="setting-item">
          <label for="client-rects-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="client-rects-spoofing" checked>
            Rects
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="random-rects-spoofing" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
        </div>

        <!-- WebGL Protection -->
        <div class="setting-item">
          <label for="webgl-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="webgl-spoofing" checked>
            WebGL
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="random-webgl-spoofing" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
        </div>

        <!-- Fonts Protection -->
        <div class="setting-item">
          <label for="fonts-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="fonts-spoofing" checked>
            Fonts
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="random-fonts-spoofing" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
        </div>

        <!-- Audio Protection -->
        <div class="setting-item">
          <label for="audio-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="audio-spoofing" checked>
            Audio
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="random-audio-spoofing" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
        </div>

        <!-- OS Spoofing -->
        <div class="setting-item">
          <label for="navi-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="navi-spoofing" checked>
            OS
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="randomize-navi" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
          <div class="setting-subitem">
            <div class="dropdown">
              <select id="navi-select" class="searchable-select">
                <option value="default" selected>Default</option>
                <option value="windows">Windows</option>
                <option value="linux">Linux</option>
                <option value="mac">Mac</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Timezone Spoofing -->
        <div class="setting-item">
          <label for="timezone-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="timezone-spoofing" checked>
            Timezone
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="randomize-timezone" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
          <div class="setting-subitem">
            <div class="dropdown">
              <select id="timezone-select" class="searchable-select">
                <!-- More options will be populated dynamically -->
              </select>
            </div>
            <div class="dropdown" style="margin-top: 8px;">
              <select id="locale-select" class="searchable-select">
                <option value="en-US" selected>English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="es-ES">Spanish (Spain)</option>
                <option value="fr-FR">French (France)</option>
                <!-- More options will be populated dynamically -->
              </select>
            </div>
            <div class="checkbox" style="margin-top: 8px;">
              <input class="checkmark" type="checkbox" id="use-system-timezone">
              <span>Use System Timezone</span>
            </div>
          </div>
        </div>

        <!-- Geolocation Spoofing -->
        <div class="setting-item">
          <label for="geo-spoofing" class="checkbox">
            <input class="checkmark" type="checkbox" id="geo-spoofing">
            Geolocation
            <label class="toggle inline" title="Random">
              <input type="checkbox" id="randomize-geo-toggle" hidden>
              <span class="toggle-switch"></span>
            </label>
          </label>
          <div class="setting-subitem">
            <label for="coordinates">Coordinates (latitude,longitude):</label>
            <input type="text" id="coordinates" class="searchable-select" placeholder="e.g. 40.7128,-74.0060"
              value="40.7128,-74.0060">
            <div class="slider-container">
              <label for="geo-accuracy">Accuracy Level:</label>
              <input type="range" id="geo-accuracy" min="10" max="100" step="1" value="64"
                title="Geolocation Accuracy Level">
              <span class="slider-value" id="geo-accuracy-value">64.0999</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Bypass Tab -->
      <div id="bypass-tab" class="tab-content">
        <h2 class="subtitle">Bypass List</h2>
        <p>Websites listed here will not have any protection applied.</p>

        <div class="bypass-list" id="bypass-list">
          <!-- Bypass items will be populated here -->
          <div class="bypass-item">
            <span>example.com</span>
            <button class="bypass-delete">✕</button>
          </div>
        </div>

        <div class="add-bypass">
          <input type="text" id="new-bypass" placeholder="Enter website domain...">
          <button id="add-bypass-btn">Add</button>
        </div>
      </div>

      <!-- Advanced Tab -->
      <div id="advanced-tab" class="tab-content">
        <h2 class="subtitle">Advanced Settings</h2>

        <!-- WebRTC Policy -->
        <div class="setting-item">
          <label class="dropdown-label">WebRTC IP Handling Policy:</label>
          <select id="dapi-select" class="searchable-select">
            <option value="default">Default</option>
            <option value="disable_non_proxied_udp" selected>Disable Non-Proxied UDP</option>
            <option value="default_public_and_private_interfaces">Default Public and Private Interfaces</option>
            <option value="default_public_interface_only">Default Public Interface Only</option>
          </select>
        </div>

        <!-- Logging -->
        <div class="setting-item">
          <label class="dropdown-label">Logging Level:</label>
          <select id="log-level" class="searchable-select">
            <option value="none">None</option>
            <option value="log">Log</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
            <option value="all">All</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
